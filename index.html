<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ГеоЛогика">
<title>ГеоЛогика — Полевой журнал</title>
<style>
:root{
  --bg:#0d0f14;--bg2:#13161e;--bg3:#1a1e2a;--bg4:#222840;
  --border:#252b3b;--border2:#2e3650;
  --y:#f5c518;--ydim:rgba(245,197,24,.1);
  --txt:#e8eaed;--txt2:#8892a4;--txt3:#4a5568;
  --green:#3ecf8e;--red:#ff6b6b;--purple:#a78bfa;
  --mono:ui-monospace,"SF Mono","Menlo","Courier New",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --r:14px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);}
#app{display:flex;flex-direction:column;height:100dvh;}

.hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:calc(var(--st)+10px) 14px 10px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.hdr-logo{height:28px;object-fit:contain;flex-shrink:0;}
.hdr-titles{flex:1;min-width:0;}
.hdr-title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:11px;color:var(--txt2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.btn-back{width:34px;height:34px;border-radius:9px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;flex-shrink:0;color:var(--txt);}
.btn-back:active{background:var(--border);}
.btn-hdr{padding:7px 13px;border-radius:9px;background:var(--y);color:#0d0f14;font-size:13px;font-weight:700;border:none;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.btn-hdr:active{opacity:.75;}
.btn-hdr.ghost{background:var(--bg3);color:var(--txt);border:1px solid var(--border);}
.btn-hdr.green{background:var(--green);color:#0d0f14;}

.screen{flex:1;overflow-y:auto;overflow-x:hidden;display:none;-webkit-overflow-scrolling:touch;}
.screen.active{display:block;}
.scroll{padding:14px 14px calc(var(--sb)+84px);}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px;}
.card-row{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;}
.card-row:active{background:var(--bg3);}
.card-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.card-info{flex:1;min-width:0;}
.card-title{font-weight:600;font-size:15px;}
.card-meta{font-size:12px;color:var(--txt2);margin-top:2px;}
.card-arr{color:var(--txt3);font-size:22px;}

.slabel{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;padding:0 2px;margin:16px 0 6px;}
.slabel:first-child{margin-top:0;}

.empty{text-align:center;padding:50px 20px;color:var(--txt2);}
.empty-ico{font-size:42px;margin-bottom:12px;opacity:.4;}
.empty-t{font-size:17px;font-weight:600;color:var(--txt);margin-bottom:6px;}

/* well info */
.well-info{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;}
.wi-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px;}
.wi-item label{font-family:var(--mono);font-size:9px;color:var(--txt3);display:block;margin-bottom:3px;text-transform:uppercase;}
.wi-item span{font-size:15px;font-weight:700;}
.wi-item span.y{color:var(--y);}
.ugv-row{display:flex;align-items:center;gap:10px;border-top:1px solid var(--border);padding-top:10px;margin-top:4px;}
.ugv-row label{font-family:var(--mono);font-size:10px;color:var(--txt3);text-transform:uppercase;white-space:nowrap;}
.ugv-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--txt);font-size:15px;font-weight:700;padding:7px 12px;outline:none;font-family:var(--sans);}
.ugv-input:focus{border-color:var(--y);}
.ugv-unit{color:var(--txt2);font-size:13px;white-space:nowrap;}

/* layer card */
.layer-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden;}
.layer-head{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;}
.layer-depth{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--y);min-width:72px;padding-top:2px;}
.layer-thick{font-family:var(--mono);font-size:10px;color:var(--txt3);margin-top:3px;}
.layer-body{flex:1;}
.layer-name{font-size:14px;font-weight:600;line-height:1.4;}
.layer-detail{font-size:12px;color:var(--txt2);margin-top:2px;line-height:1.4;}
.layer-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.tag{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--bg3);border:1px solid var(--border);color:var(--txt2);}
.tag.y{color:var(--y);border-color:rgba(245,197,24,.3);background:rgba(245,197,24,.07);}
.tag.g{color:var(--green);border-color:rgba(62,207,142,.3);background:rgba(62,207,142,.07);}
.layer-del{color:var(--txt3);font-size:16px;padding:2px 0 2px 8px;cursor:pointer;flex-shrink:0;}
.layer-del:active{color:var(--red);}

/* voice */
.voice-box{border-top:1px solid var(--border);padding:8px 14px;display:flex;align-items:flex-start;gap:8px;}
.voice-list{flex:1;display:flex;flex-direction:column;gap:5px;}
.voice-item{display:flex;align-items:center;gap:6px;background:var(--bg3);border-radius:8px;padding:6px 10px;}
.voice-item audio{flex:1;height:28px;min-width:0;}
.voice-del{color:var(--txt3);font-size:13px;cursor:pointer;flex-shrink:0;}
.voice-del:active{color:var(--red);}
.btn-rec{flex-shrink:0;padding:7px 11px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--txt2);font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap;}
.btn-rec.rec{background:rgba(255,107,107,.12);border-color:var(--red);color:var(--red);}
.wv-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;}
.wv-title{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}

/* samples */
.samples-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden;}
.samples-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);}
.samples-title{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;}
.btn-add-sample{padding:5px 11px;border-radius:7px;background:var(--bg3);border:1px solid var(--border);color:var(--txt2);font-size:12px;font-weight:600;cursor:pointer;}
.btn-add-sample:active{background:var(--border);}
.sample-row{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border);}
.sample-row:last-child{border-bottom:none;}
.sample-num{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--purple);min-width:80px;}
.sample-depth{font-family:var(--mono);font-size:12px;color:var(--txt2);}
.sample-del{color:var(--txt3);font-size:14px;cursor:pointer;margin-left:auto;padding:2px 4px;}
.sample-del:active{color:var(--red);}
.no-samples{padding:12px 14px;font-size:13px;color:var(--txt3);font-style:italic;}

/* FAB */
.fab{position:fixed;bottom:calc(var(--sb)+18px);right:16px;width:54px;height:54px;border-radius:16px;background:var(--y);color:#0d0f14;box-shadow:0 4px 20px rgba(245,197,24,.35);display:flex;align-items:center;justify-content:center;font-size:30px;border:none;cursor:pointer;z-index:40;transition:transform .12s;}
.fab:active{transform:scale(.9);}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);z-index:200;display:none;align-items:flex-end;opacity:0;transition:opacity .2s;}
.overlay.open{display:flex;}
.overlay.vis{opacity:1;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:22px 22px 0 0;width:100%;max-height:92dvh;overflow-y:auto;padding:0 0 calc(var(--sb)+16px);transform:translateY(50px);transition:transform .25s cubic-bezier(.34,1.3,.64,1);}
.overlay.vis .modal{transform:translateY(0);}
.m-handle{width:34px;height:4px;border-radius:2px;background:var(--border2);margin:12px auto 18px;}
.m-title{font-family:var(--mono);font-size:13px;font-weight:700;padding:0 18px 14px;border-bottom:1px solid var(--border);margin-bottom:14px;color:var(--y);}
.fg{padding:0 18px;margin-bottom:14px;}
.flabel{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px;}
.finput,.fselect{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:9px;color:var(--txt);font-family:var(--sans);font-size:16px;padding:10px 13px;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none;}
.finput:focus,.fselect:focus{border-color:var(--y);}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fsel-w{position:relative;}
.fsel-w::after{content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--txt2);pointer-events:none;}
.fbtn{width:calc(100% - 36px);margin:6px 18px 0;padding:13px;border-radius:11px;background:var(--y);color:#0d0f14;font-family:var(--sans);font-size:16px;font-weight:700;border:none;cursor:pointer;}
.fbtn:active{opacity:.78;}
.fbtn.ghost{background:var(--bg3);color:var(--txt);border:1px solid var(--border);}
/* inline add for drill list */
.drill-add-row{display:flex;gap:8px;padding:0 18px;margin-bottom:14px;}
.drill-add-row .finput{flex:1;}
.drill-add-btn{padding:10px 14px;border-radius:9px;background:var(--bg4);border:1px solid var(--border);color:var(--txt);font-size:14px;cursor:pointer;white-space:nowrap;}
.drill-add-btn:active{background:var(--border);}

/* export */
.exp-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px;font-family:var(--mono);font-size:12px;line-height:1.9;white-space:pre-wrap;color:var(--txt);margin-bottom:12px;word-break:break-word;}
.btn-big{width:100%;padding:13px;font-family:var(--sans);font-size:15px;font-weight:700;border:none;border-radius:11px;cursor:pointer;margin-bottom:10px;}
.btn-big:active{opacity:.78;}
.btn-big.green{background:var(--green);color:#0d0f14;}
.btn-big.yellow{background:var(--y);color:#0d0f14;}

/* toast */
.toast{position:fixed;bottom:calc(var(--sb)+90px);left:50%;transform:translateX(-50%) translateY(16px);background:var(--green);color:#0d0f14;font-weight:700;font-size:13px;padding:9px 18px;border-radius:18px;opacity:0;transition:opacity .2s,transform .2s;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* splash */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .4s;}
#splash img{width:200px;object-fit:contain;margin-bottom:16px;}
#splash .tl{font-family:var(--mono);font-size:11px;color:var(--txt3);letter-spacing:.08em;}
</style>
</head>

<script>
// ══ STATE ══
const STORE = 'gl_v4';
let S = (() => { try{ return JSON.parse(localStorage.getItem(STORE))||{projects:[],rigs:['УРБ-2А2','ПБУ-2','ЛБУ-50','МГБУ-2000'],cur:{pid:null,wid:null}}; }catch(e){ return {projects:[],rigs:['УРБ-2А2','ПБУ-2','ЛБУ-50','МГБУ-2000'],cur:{pid:null,wid:null}}; } })();
const voices = {};
let mediaRecorder=null, audioChunks=[], activeRecKey=null, activeRecBtnId=null;

function save(){ try{localStorage.setItem(STORE,JSON.stringify(S));}catch(e){} }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function goTo(s){ document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active')); document.getElementById('s-'+s).classList.add('active'); }
function openModal(id){
  const el=document.getElementById(id);
  el.style.display='flex';
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('vis')));
  if(id==='m-well') document.getElementById('wn-date').value=new Date().toISOString().slice(0,10);
  if(id==='m-layer'){
    const w=getWell();
    const last=w&&w.layers.length?w.layers[w.layers.length-1]:null;
    document.getElementById('ln-from').value=last?last.to:'';
    document.getElementById('ln-to').value='';
    ['ln-soil','ln-note','ln-color','ln-gen','ln-cons'].forEach(i=>document.getElementById(i).value='');
  }
  if(id==='m-sample'||id==='m-water'){
    ['sm-type','sm-depth','sm-note','wm-type','wm-depth','wm-note'].forEach(i=>{ const el=document.getElementById(i); if(el) el.value=''; });
  }
}
function closeModal(id){ const el=document.getElementById(id); el.classList.remove('vis'); setTimeout(()=>el.style.display='none',220); }
function bgClose(e,id){ if(e.target.classList.contains('overlay')) closeModal(id); }
function getProj(){ return S.projects.find(p=>p.id===S.cur.pid); }
function getWell(){ const pr=getProj(); return pr?pr.wells.find(w=>w.id===S.cur.wid):null; }
function toast(msg,color){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.background=color||'var(--green)'; t.style.color=color?'#fff':'#0d0f14';

}

function delProj(pid){

  S.projects=S.projects.filter(x=>x.id!==pid);
  if(S.cur.pid===pid){S.cur.pid=null;S.cur.wid=null;}

  toast('Объект удалён',var_red);

function saveProj(){

// ══ LAYERS ══
function voiceHTML(key,btnId){
  const vlist=voices[key]||[];
  return `<div class="voice-list" id="vl-${key}">${vlist.map(v=>`
    <div class="voice-item" id="vi-${v.id}">
      <audio controls src="${v.url}"></audio>
      <span class="voice-del" onclick="delVoice('${key}','${v.id}')">✕</span>
    </div>`).join('')}</div>
  <button class="btn-rec" id="${btnId}" onclick="toggleRecord('${key}','${btnId}')">🎙 Запись</button>`;
}

function renderLayers(){
  const w=getWell();
  const el=document.getElementById('layers-content');
  if(!w){el.innerHTML='';return;}

  // Well info + УГВ
  let html=`<div class="well-info">
    <div class="wi-grid">
      <div class="wi-item"><label>Скважина</label><span class="y">${w.num}</span></div>
      <div class="wi-item"><label>Глубина</label><span>${w.depth} м</span></div>
      <div class="wi-item"><label>Дата</label><span>${w.date}</span></div>
    </div>
    <div class="ugv-row">
      <label>УГВ</label>
      <input class="ugv-input" id="ugv-val" type="number" step="0.01" placeholder="не вскрыт" value="${w.ugv||''}">
      <span class="ugv-unit">м</span>
      <button class="btn-hdr" style="padding:6px 12px;font-size:12px" onclick="saveUGV()">Сохранить</button>
    </div>
  </div>`;

  // Well voice
  html+=`<div class="wv-box">
    <div class="wv-title">🎙 Голосовые заметки — скважина</div>
    <div class="voice-box" style="border:none;padding:0">${voiceHTML('w_'+w.id,'wvbtn-'+w.id)}</div>
  </div>`;

  // Layers
  html+='<div class="slabel">Слои грунта</div>';
  if(!w.layers.length){
    html+=`<div style="color:var(--txt3);font-size:13px;padding:8px 2px;font-style:italic">Нажмите + внизу чтобы добавить первый слой</div>`;
  } else {
    w.layers.forEach(l=>{
      const thick=(parseFloat(l.to)-parseFloat(l.from)).toFixed(2);
      const gTag=l.gen?`<span class="tag y">${l.gen}</span>`:'';
      const cTag=l.cons?`<span class="tag g">${l.cons}</span>`:'';
      const colTag=l.color?`<span class="tag">${l.color}</span>`:'';
      const btnId='lvbtn-'+l.id;
      html+=`<div class="layer-card">
        <div class="layer-head">
          <div>
            <div class="layer-depth">${l.from}–${l.to} м</div>
            <div class="layer-thick">${thick} м</div>
          </div>
          <div class="layer-body">
            <div class="layer-name">${l.soil||'—'}</div>
            ${l.note?`<div class="layer-detail">${l.note}</div>`:''}
            <div class="layer-tags">${gTag}${colTag}${cTag}</div>
          </div>
          <span class="layer-del" onclick="delLayer('${l.id}')">✕</span>
        </div>
        <div class="voice-box">${voiceHTML(l.id,btnId)}</div>
      </div>`;
    });
  }

  // Soil samples
  const ss=w.soilSamples||[];
  html+=`<div class="slabel">Пробы грунта</div>
  <div class="samples-box">
    <div class="samples-hdr">
      <span class="samples-title">Пробы грунта (${ss.length})</span>
      <button class="btn-add-sample" onclick="openModal('m-sample')">+ Проба</button>
    </div>
    ${ss.length?ss.map((s,i)=>`
      <div class="sample-row">
        <span class="sample-num">${s.type}${i+1}</span>
        <span class="sample-depth">📍 ${s.depth} м</span>
        ${s.note?`<span style="font-size:12px;color:var(--txt2);flex:1;padding:0 6px">${s.note}</span>`:'<span style="flex:1"></span>'}
        <span class="sample-del" onclick="delSample('soil',${i})">✕</span>
      </div>`).join(''):`<div class="no-samples">Нет проб грунта</div>`}
  </div>`;

  // Water samples
  const ws=w.waterSamples||[];
  html+=`<div class="slabel">Пробы воды</div>
  <div class="samples-box">
    <div class="samples-hdr">
      <span class="samples-title">Пробы воды (${ws.length})</span>
      <button class="btn-add-sample" onclick="openModal('m-water')">+ Проба воды</button>
    </div>
    ${ws.length?ws.map((s,i)=>`
      <div class="sample-row">
        <span class="sample-num" style="color:var(--blue,#4a9eff)">${s.type}${i+1}</span>
        <span class="sample-depth">💧 ${s.depth} м</span>
        ${s.note?`<span style="font-size:12px;color:var(--txt2);flex:1;padding:0 6px">${s.note}</span>`:'<span style="flex:1"></span>'}
        <span class="sample-del" onclick="delSample('water',${i})">✕</span>
      </div>`).join(''):`<div class="no-samples">Нет проб воды</div>`}
  </div>`;

  el.innerHTML=html;
}

function saveLayer(){
  const from=document.getElementById('ln-from').value;
  const to=document.getElementById('ln-to').value;
  if(!from||!to){toast('Укажите глубины',var_red);return;}
  const l={
    id:uid(),
    from:parseFloat(from).toFixed(2),
    to:parseFloat(to).toFixed(2),
    soil:document.getElementById('ln-soil').value.trim(),
    note:document.getElementById('ln-note').value.trim(),
    color:document.getElementById('ln-color').value.trim(),
    gen:document.getElementById('ln-gen').value.trim(),
    cons:document.getElementById('ln-cons').value.trim()
  };
  const w=getWell();
  w.layers.push(l);
  w.layers.sort((a,b)=>parseFloat(a.from)-parseFloat(b.from));
  save(); closeModal('m-layer'); renderLayers();
  toast('Слой добавлен');
}

function delLayer(lid){
  if(!confirm('Удалить слой?'))return;
  const w=getWell();
  w.layers=w.layers.filter(l=>l.id!==lid);
  delete voices[lid]; save(); renderLayers();
  toast('Удалено',var_red);
}

// ══ SAMPLES ══
function saveSample(kind){
  const isWater=kind==='water';
  const pre=isWater?'wm':'sm';
  const type=document.getElementById(pre+'-type').value.trim();
  const depth=document.getElementById(pre+'-depth').value;
  if(!type||!depth){toast('Заполните тип и глубину',var_red);return;}
  const s={type,depth:parseFloat(depth).toFixed(2),note:document.getElementById(pre+'-note').value.trim()};
  const w=getWell();
  if(isWater){ if(!w.waterSamples) w.waterSamples=[]; w.waterSamples.push(s); }
  else { if(!w.soilSamples) w.soilSamples=[]; w.soilSamples.push(s); }
  save(); closeModal(isWater?'m-water':'m-sample'); renderLayers();
  toast(isWater?'Проба воды добавлена':'Проба добавлена');
}

function delSample(kind,idx){
  if(!confirm('Удалить пробу?'))return;
  const w=getWell();
  if(kind==='water') w.waterSamples.splice(idx,1);
  else w.soilSamples.splice(idx,1);
  save(); renderLayers();
  toast('Удалено',var_red);
}

// ══ VOICE ══
function toggleRecord(key,btnId){
  const btn=document.getElementById(btnId);
  if(mediaRecorder&&mediaRecorder.state==='recording'){ mediaRecorder.stop(); return; }
  if(!navigator.mediaDevices){toast('Микрофон недоступен',var_red);return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    activeRecKey=key; activeRecBtnId=btnId; audioChunks=[];
    const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':'';
    mediaRecorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
    mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data);};
    mediaRecorder.onstop=()=>{
      const blob=new Blob(audioChunks,{type:mediaRecorder.mimeType||'audio/webm'});
      const url=URL.createObjectURL(blob);
      if(!voices[activeRecKey]) voices[activeRecKey]=[];
      voices[activeRecKey].push({id:uid(),url});
      stream.getTracks().forEach(t=>t.stop());
      const b=document.getElementById(activeRecBtnId);
      if(b){b.textContent='🎙 Запись';b.classList.remove('rec');}
      renderLayers(); toast('Запись сохранена');
    };
    mediaRecorder.start();
    if(btn){btn.innerHTML='⏹ Стоп';btn.classList.add('rec');}
  }).catch(()=>toast('Нет доступа к микрофону',var_red));
}

function delVoice(key,vid){
  if(!voices[key])return;
  voices[key]=voices[key].filter(v=>v.id!==vid);
  renderLayers();
}

// ══ PDF — весь объект ══
function buildWellText(p, w){
  const line='─'.repeat(58);
  let t='';
  t+=`${w.num}  |  Глубина: ${w.depth} м  |  УГВ: ${w.ugv||'не вскрыт'} м  |  ${w.date}\n`;
  t+=`Объект: ${p.name}  |  ${p.org||''}\n`;
  t+=`Геолог: ${p.geo||'—'}  |  Бур. установка: ${p.rig||'—'}  |  ${p.drill}, Ø${p.diam} мм\n`;
  t+=line+'\n';
  if(!w.layers.length){ t+='(слои не добавлены)\n'; }
  else {
    w.layers.forEach(l=>{
      const thick=(parseFloat(l.to)-parseFloat(l.from)).toFixed(2);
      t+=`${l.from}–${l.to} м (${thick} м) — ${l.soil||'—'}`;
      if(l.note) t+=`, ${l.note}`;
      if(l.color) t+=`, ${l.color}`;
      if(l.gen) t+=`, ${l.gen}`;
      if(l.cons) t+=`, ${l.cons}`;
      t+='\n';
    });
  }
  t+=line+'\n';
  t+=`Забой скважины: ${w.depth} м\n`;
  const ss=w.soilSamples||[];
  const ws=w.waterSamples||[];
  if(ss.length){
    t+='\nПробы грунта:\n';
    ss.forEach((s,i)=>{ t+=`  ${s.type}${i+1} — ${s.depth} м${s.note?' ('+s.note+')':''}\n`; });
  }
  if(ws.length){
    t+='\nПробы воды:\n';
    ws.forEach((s,i)=>{ t+=`  ${s.type}${i+1} — ${s.depth} м${s.note?' ('+s.note+')':''}\n`; });
  }
  return t;
}
